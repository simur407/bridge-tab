<!DOCTYPE html>
<html lang="pl">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="robots" content="noindex">
    <title>{{ if .Title }}{{ .Title }} — {{ end }}Bridge Tab</title>
    <script src="https://unpkg.com/htmx.org@2.0.3" integrity="sha384-0895/pl2MU10Hqc6jd4RvrthNlDiE9U1tWmX7WRESftEDRosgxNsQG/Ze9YMRzHq" crossorigin="anonymous"></script>
    <script src="/script/layout.js"></script>
    <link rel="stylesheet" href="/css/tablet.css">
  </head>
  <body class="play-body">
    <div class="play-frame" aria-label="Stół, północ u góry">
      <div class="dir n{{ if .ShowVulnerability }} {{ if .NsVulnerable }}vul{{ else }}nv{{ end }}{{ end }}">
        <span class="seat">N</span>
        {{ if .NsTeamLabel }}<span class="team">{{ .NsTeamLabel }}</span>{{ end }}
      </div>
      <div class="dir w{{ if .ShowVulnerability }} {{ if .EwVulnerable }}vul{{ else }}nv{{ end }}{{ end }}">
        <span class="seat">W</span>
        {{ if .EwTeamLabel }}<span class="team">{{ .EwTeamLabel }}</span>{{ end }}
      </div>
      <main class="play-center">
        {{ if .Error }}
        <p class="error">{{ .Error }}</p>
        {{ end }}
        {{ if .Success }}
        <p class="success">{{ .Success }}</p>
        {{ end }}
        {{embed}}
      </main>
      <div class="dir e{{ if .ShowVulnerability }} {{ if .EwVulnerable }}vul{{ else }}nv{{ end }}{{ end }}">
        <span class="seat">E</span>
        {{ if .EwTeamLabel }}<span class="team">{{ .EwTeamLabel }}</span>{{ end }}
      </div>
      <div class="dir s{{ if .ShowVulnerability }} {{ if .NsVulnerable }}vul{{ else }}nv{{ end }}{{ end }}">
        <span class="seat">S</span>
        {{ if .NsTeamLabel }}<span class="team">{{ .NsTeamLabel }}</span>{{ end }}
      </div>
    </div>
    <script src="/script/play.js"></script>
  </body>
</html>
