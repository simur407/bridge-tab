<!DOCTYPE html>
<html lang="pl">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="robots" content="noindex">
    <meta name="theme-color" content="#005ad7">
    <meta name="mobile-web-app-capable" content="yes">
    <title>{{ if .Title }}{{ .Title }} — {{ end }}Bridge Tab</title>
    <link rel="manifest" href="{{ base }}/manifest.json">
    <link rel="icon" href="{{ base }}/icons/favicon.ico" sizes="any">
    <link rel="apple-touch-icon" href="{{ base }}/icons/icon-192.png">
    <!-- htmx 1.7.0 is the last release that parses in wallpanel-android-legacy (WebView based on Chrome 30). 1.8+ uses let/const. -->
    <script src="{{ base }}/script/htmx-1.7.0.min.js"></script>
    <link rel="stylesheet" href="{{ base }}/css/tablet.css">
  </head>
  <body>
    {{ if .Error }}
    <p class="error">{{ .Error }}</p>
    {{ end }}
    {{ if .Success }}
    <p class="success">{{ .Success }}</p>
    {{ end }}
    {{embed}}
  </body>
</html>
