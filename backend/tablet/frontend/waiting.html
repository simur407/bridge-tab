<div class="end-screen" hx-get="{{ base }}/" hx-trigger="every 3s" hx-swap="none">
  <p class="end-kicker">Stół {{ .TableNumber }}</p>
  <h1 class="end-title">Oczekiwanie na start</h1>
  {{ if .TournamentName }}
  <p class="end-name">{{ .TournamentName }}</p>
  {{ end }}
  <p class="wait-suits" aria-hidden="true">
    <span class="suit club wait-suit">♠</span>
    <span class="suit red wait-suit">♥</span>
    <span class="suit red wait-suit">♦</span>
    <span class="suit club wait-suit">♣</span>
  </p>
</div>
