<!DOCTYPE html>
<html lang="pl">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex">
    <title>{{ if .Title }}{{ .Title }} — {{ end }}Bridge Tab</title>
    <link rel="stylesheet" href="{{ base }}/css/admin.css">
  </head>
  <body>
    {{ if .CSRF }}
    <nav class="nav">
      <a href="{{ base }}/tournaments">Turnieje</a>
      {{ if .TournamentId }}
      <a href="{{ base }}/tournaments/{{ .TournamentId }}">{{ .TournamentName }}</a>
      <a href="{{ base }}/tournaments/{{ .TournamentId }}/teams">Drużyny</a>
      <a href="{{ base }}/tournaments/{{ .TournamentId }}/tables">Stoły</a>
      <a href="{{ base }}/tournaments/{{ .TournamentId }}/protocols">Protokoły</a>
      <a href="{{ base }}/tournaments/{{ .TournamentId }}/sets">Komplety</a>
      <a href="{{ base }}/tournaments/{{ .TournamentId }}/schedule">Harmonogram</a>
      <a href="{{ base }}/tournaments/{{ .TournamentId }}/rounds">Rozdania</a>
      <a href="{{ base }}/tournaments/{{ .TournamentId }}/scores">Wyniki</a>
      <a id="umpire-nav" href="{{ base }}/tournaments/{{ .TournamentId }}/umpire-calls" data-open-url="{{ base }}/tournaments/{{ .TournamentId }}/umpire-calls/open">Wezwania</a>
      {{ end }}
      <form method="post" action="{{ base }}/logout">
        <input type="hidden" name="csrf" value="{{ .CSRF }}">
        <button type="submit">Wyloguj</button>
      </form>
    </nav>
    {{ if .TournamentId }}
    <div id="umpire-stack"></div>
    {{ end }}
    {{ end }}
    {{ if .Error }}
    <p class="error">{{ .Error }}</p>
    {{ end }}
    {{embed}}
    {{ if .TournamentId }}
    <script>
      (function () {
        var link = document.getElementById("umpire-nav");
        var stack = document.getElementById("umpire-stack");
        if (!link || !stack) return;
        function apply(html) {
          stack.innerHTML = html;
          var root = stack.querySelector("[data-open]");
          var count = root ? parseInt(root.getAttribute("data-open"), 10) : 0;
          if (count > 0) {
            link.className = "open-calls";
            link.textContent = "Wezwania (" + count + ")";
          } else {
            link.className = "";
            link.textContent = "Wezwania";
          }
        }
        function poll() {
          fetch(link.getAttribute("data-open-url"), { credentials: "same-origin" }).then(function (res) {
            if (!res.ok) return null;
            return res.text();
          }).then(function (html) {
            if (html == null) return;
            apply(html);
          }).catch(function () {});
        }
        poll();
        setInterval(poll, 5000);
      })();
    </script>
    {{ end }}
  </body>
</html>
