networks:
  default:
    name: bridge-tab
services:
  db:
    # Pin major version: postgres:latest is 18+, which stores data under
    # versioned paths and rejects the classic ./data:/var/lib/postgresql/data mount.
    image: postgres:16
    # set shared memory limit when using docker-compose
    shm_size: 128mb
    environment:
      POSTGRES_USER: bridge-tab
      POSTGRES_PASSWORD: bridge-tab
    ports:
      # Host 5444 avoids clashing with another local Postgres on 5432
      - '5444:5432'
    volumes:
      - ./data:/var/lib/postgresql/data
  pgadmin:
    image: dpage/pgadmin4
    profiles: [pgadmin]
    environment:
      PGADMIN_DEFAULT_EMAIL: bridge-tab@one-unit.com
      PGADMIN_DEFAULT_PASSWORD: DuplicateBridge
      PGADMIN_LISTEN_PORT: 80
      PGADMIN_SERVER_JSON_FILE: /pgadmin4/config/servers.json
    ports:
    - '8888:80'
    volumes:
    - ./pgadmin-config:/pgadmin4/config
